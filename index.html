<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Team Empire Performance Hub</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0c2146">
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/extra.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4fbdf2"/><stop offset="1" stop-color="#d9ac69"/></linearGradient>
<symbol id="i-dash" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></symbol>
<symbol id="i-audit" viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 5.6a5.2 5.2 0 0 0-7.4 0L12 7l-1.4-1.4a5.2 5.2 0 0 0-7.4 7.4L12 21.8l8.8-8.8a5.2 5.2 0 0 0 0-7.4z"/></symbol>
<symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
<symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
<symbol id="i-dl" viewBox="0 0 24 24"><path d="M12 4v12M6 12l6 6 6-6M4 21h16"/></symbol>
<symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></symbol>
<symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></symbol>
<symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
<symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
<symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
</defs></svg>

<!-- LOGIN GATE -->
<section class="login" id="login" aria-label="Sign in">
  <div class="chase chase-bg" data-chase></div>
  <div class="birds" data-birds aria-hidden="true"></div>
  <form class="login-card" id="loginForm" autocomplete="off">
    <div class="lg-wrap"><span class="lg-ring"></span><span class="lg-ring r2"></span><img class="lg" src="logo.png" alt="Team Empire logo"></div>
    <h1>Team Empire</h1>
    <p class="sub">Performance Hub · please sign in</p>
    <label for="lid">ID</label><input id="lid" name="id" type="text" placeholder="Genex ID, e.g. genex.surma" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    <label for="lpw">Password</label><input id="lpw" name="pw" type="password" autocomplete="current-password" required>
    <div class="login-err" id="lerr" hidden role="alert"></div>
    <button class="btn primary" id="lbtn" type="submit"><span>Sign in</span></button>
    <div class="login-foot">Better quality, stronger performance</div>
  </form>
</section>

<!-- WELCOME (after sign-in) -->
<section class="login welcome" id="welcome" aria-label="Welcome" hidden>
  <div class="birds" data-birds aria-hidden="true"></div>
  <div class="wl-in">
    <div class="stage" id="stage"><div class="orbit" id="orbit"></div>
      <div class="tl-ph"><span class="tl-glow"></span><img id="tlImg" src="photos/tl.jpg" alt="Team Leader"></div></div>
    <div class="tl-cap"><small>Team Leader Of Team Empire</small><b>Md Ariful Mowla Neloy</b></div>
    <button class="btn primary open-dash" id="openDash" type="button">Open Dashboard</button>
    <div class="wel-row"><div class="soldier" id="soldier"></div><div><h2>Welcome to Team Empire</h2><p>Better quality, stronger performance</p></div></div>
  </div>
</section>

<!-- APP -->
<div class="app" id="app" hidden>
  <aside class="side" id="side" aria-label="Sections">
    <div class="brand"><img alt="Team Empire logo" src="logo.png"><div><b>Team Empire</b><span>Performance Hub</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot">Better quality, stronger performance</div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="btn menu-btn" id="menuBtn" aria-label="Open menu"><svg><use href="#i-menu"/></svg></button>
      <h2 id="pageTitle">Dashboard</h2>
      <div class="field"><label for="agentSel">Agent</label><select id="agentSel"></select></div>
      <button class="btn primary" id="upBtn"><svg><use href="#i-up"/></svg><span>Update Data</span></button>
      <button class="btn" id="pwBtn" aria-label="Change password" title="Change password"><svg><use href="#i-key"/></svg></button>
      <button class="btn" id="themeBtn" aria-label="Switch theme"><svg><use href="#i-sun"/></svg></button>
      <button class="btn" id="outBtn" aria-label="Sign out" title="Sign out"><svg><use href="#i-out"/></svg></button>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>
<div id="tip" role="tooltip"></div>
<div id="modalRoot"></div>

<script src="js/jszip.min.js"></script>
<script src="js/core.js"></script>
<script src="js/app.js"></script>
</body>
</html>
